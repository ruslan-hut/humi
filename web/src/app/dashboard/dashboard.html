<section>
  <h1>Rooms</h1>

  @if (error(); as message) {
    <p class="notice" role="alert">{{ message }}</p>
  }

  @if (loading()) {
    <p class="notice">Loading…</p>
  } @else if (nodes().length === 0) {
    <p class="notice">
      No sensors yet.
      @if (auth.isAdmin()) {
        <a routerLink="/settings/sensors/new">Add the first one</a>.
      } @else {
        Ask an admin to add one.
      }
    </p>
  } @else {
    <div class="grid">
      @for (node of nodes(); track node.slug) {
        <app-node-card [node]="node" />
      }
    </div>
  }
</section>
